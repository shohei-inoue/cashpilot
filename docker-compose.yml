services:
  db:
    image: postgres:16-alpine
    container_name: cashpilot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cashpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashpilot}
      POSTGRES_DB: ${POSTGRES_DB:-cashpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cashpilot} -d ${POSTGRES_DB:-cashpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cashpilot-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cashpilot}:${POSTGRES_PASSWORD:-cashpilot}@db:5432/${POSTGRES_DB:-cashpilot}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cashpilot-frontend
    ports:
      - "3010:3010"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "pnpm install && pnpm dev --hostname 0.0.0.0"

volumes:
  postgres_data:
  frontend_node_modules:
