services:
  db:
    image: postgres:16-alpine
    container_name: cashpilot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cashpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashpilot}
      POSTGRES_DB: ${POSTGRES_DB:-cashpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cashpilot} -d ${POSTGRES_DB:-cashpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    container_name: cashpilot-migrate
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-cashpilot}:${POSTGRES_PASSWORD:-cashpilot}@db:5432/${POSTGRES_DB:-cashpilot}?sslmode=disable", "up"]
    volumes:
      - ./backend/db/migrations:/migrations
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: dev
    container_name: cashpilot-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cashpilot}:${POSTGRES_PASSWORD:-cashpilot}@db:5432/${POSTGRES_DB:-cashpilot}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - ./backend:/app
      - go_build_cache:/go/pkg/mod
    command: ["air", "-c", "docker/.air.toml"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cashpilot-frontend
    ports:
      - "3010:3010"
    environment:
      CI: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "pnpm install && pnpm dev --hostname 0.0.0.0"

volumes:
  postgres_data:
  frontend_node_modules:
  go_build_cache:
