# agent:merge-ready ラベル付き PR を CI 成功後に自動マージする。
# レビュー・マージエージェント（cashpilot-review-merge）が agent:merge-ready を付与した後に実行される。

name: Agent Auto Merge

on:
  pull_request:
    types: [labeled, synchronize]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      github.event_name == 'pull_request' &&
      github.event.label.name == 'agent:merge-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: .*
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success,skipped

      - name: Enable auto-merge
        run: gh pr merge --squash --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  auto-merge-on-ci:
    if: >
      github.event_name == 'check_suite' &&
      github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find merge-ready PRs
        id: find-pr
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$GH_REPO" \
            --label "agent:merge-ready" \
            --state open \
            --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"${{ github.event.check_suite.head_sha }}\") | .number" \
            | head -1)
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR with agent:merge-ready for this commit. Skipping."
          else
            echo "Found PR #$PR_NUMBER"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Merge PR
        if: steps.find-pr.outputs.pr_number != ''
        run: gh pr merge --squash --auto "${{ steps.find-pr.outputs.pr_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
