# Issue 作成時に実装案を提案する。
# 一言で書かれた Issue でも architect subagent が実装案を出し、
# ユーザーの追加入力を待つ（agent:plan-proposed）。

name: Agent Trigger Deliberation

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: agent-deliberation-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  trigger:
    if: >
      (
        github.event.action == 'opened' &&
        (
          length(github.event.issue.body) <= 300 ||
          contains(join(github.event.issue.labels.*.name, ','), 'agent:proposed')
        ) &&
        !contains(join(github.event.issue.labels.*.name, ','), 'agent:plan-proposed') &&
        !contains(join(github.event.issue.labels.*.name, ','), 'agent:approved') &&
        !contains(join(github.event.issue.labels.*.name, ','), 'agent:rejected')
      ) ||
      (
        github.event.action == 'labeled' &&
        github.event.label.name == 'agent:proposed' &&
        !contains(join(github.event.issue.labels.*.name, ','), 'agent:plan-proposed')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Request implementation plan via @cursor comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file - <<EOF
          @cursor

          Issue #${ISSUE_NUMBER} の要望を読み、**実装案を提案**してください。分析だけで終わらず、必ず gh コマンドを実行すること。

          ## 手順

          1. Issue を読む:
             gh issue view ${ISSUE_NUMBER} --repo ${GH_REPO}

          2. docs/implementation-flow.md, docs/frontend.md, docs/backend.md を読み、architect subagent で評価する

          3. Issue に実装案をコメント（先頭に \`【実装案】\` を付ける）:
             - 要望の解釈（一言でも具体化する）
             - 変更対象ファイル・画面・API
             - 実装ステップ（3〜5 項目）
             - 受け入れ条件
             - リスク・スコープ外の明示
             - 却下すべき場合は理由と代替案

             gh issue comment ${ISSUE_NUMBER} --repo ${GH_REPO} --body "【実装案】..."

          4. ラベルを更新:
             gh issue edit ${ISSUE_NUMBER} --repo ${GH_REPO} --add-label "agent:plan-proposed" --remove-label "agent:proposed"

          5. ユーザーへの案内をコメント末尾に含める:
             - \`実装して\` / \`/implement\` → 実装と PR 作成
             - \`修正案: ...\` / \`/revise\` → 実装案を更新
             - \`却下\` / \`/reject\` → 却下

          ## 制約

          - この段階ではコード変更・PR 作成・agent:approved 付与は行わない
          - スコープ外でもまず実装案または却下理由を提示する
          EOF
