# agent:proposed ラベル付き Issue を Cursor に吟味依頼する。
# Webhook Automation は Issue への gh 実行が不安定なため、
# 動作確認済みの @cursor Issue コメント経由で起動する。

name: Agent Trigger Deliberation

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  trigger:
    if: >
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'agent:proposed')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent:proposed')
    runs-on: ubuntu-latest
    steps:
      - name: Request Cursor deliberation via @cursor comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file - <<EOF
          @cursor

          Issue #${ISSUE_NUMBER}（agent:proposed）を吟味してください。分析だけで終わらず、必ず gh コマンドを実行すること。

          ## 手順

          1. Issue を読む:
             gh issue view ${ISSUE_NUMBER} --repo ${GH_REPO}

          2. docs/implementation-flow.md, docs/frontend.md を読み、architect subagent で評価する

          3. 吟味結果をコメント:
             gh issue comment ${ISSUE_NUMBER} --repo ${GH_REPO} --body "【吟味結果】判定: 承認または却下。理由: ..."

          4. ラベルを更新（承認の場合）:
             gh issue edit ${ISSUE_NUMBER} --repo ${GH_REPO} --add-label "agent:approved" --remove-label "agent:proposed"

             却下の場合:
             gh issue edit ${ISSUE_NUMBER} --repo ${GH_REPO} --add-label "agent:rejected" --remove-label "agent:proposed"

          ## 判定基準

          - 承認: Phase 5 スコープ内、バックエンド API が既に存在
          - 却下: スコープ外、新 API 開発が必要
          EOF
