# Issue 作成時に難易度（easy / normal / hard）を判定し、段階に応じた提案を行う。

name: Agent Trigger Deliberation

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: agent-deliberation-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  trigger:
    if: >
      (
        github.event.action == 'opened' &&
        (
          length(github.event.issue.body) <= 300 ||
          contains(join(github.event.issue.labels.*.name, ','), 'agent:proposed')
        ) &&
        !contains(join(github.event.issue.labels.*.name, ','), 'agent:plan-proposed') &&
        !contains(join(github.event.issue.labels.*.name, ','), 'agent:test-proposed') &&
        !contains(join(github.event.issue.labels.*.name, ','), 'agent:approved') &&
        !contains(join(github.event.issue.labels.*.name, ','), 'agent:rejected')
      ) ||
      (
        github.event.action == 'labeled' &&
        github.event.label.name == 'agent:proposed' &&
        !contains(join(github.event.issue.labels.*.name, ','), 'agent:plan-proposed')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Request difficulty assessment via @cursor comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file - <<EOF
          @cursor

          Issue #${ISSUE_NUMBER} の要望を読み、**難易度（easy / normal / hard）を判定**し、段階に応じた提案をしてください。必ず gh コマンドを実行すること。

          ## 手順

          1. Issue を読む:
             gh issue view ${ISSUE_NUMBER} --repo ${GH_REPO}

          2. docs/implementation-flow.md, docs/frontend.md, docs/backend.md を読み、architect subagent で評価する

          3. 難易度を判定し、Issue にコメント（先頭に \`【実装案】\`、1 行目に \`難易度: easy|normal|hard\` を必ず含める）:

          ### easy（単純・局所変更・既存パターン踏襲）

          - 要望の解釈（1〜2 文）
          - 変更対象ファイル（概略）
          - 受け入れ条件（箇条書き 2〜3 項目）
          - 末尾: \`OK で実装を開始します。\`

          ### normal（複数ファイル・設計判断が少し必要）

          - 要望の解釈
          - 変更対象ファイル・画面・API
          - 実装ステップ（3〜5 項目）
          - 受け入れ条件
          - リスク・スコープ外の明示
          - 末尾: \`OK で実装を開始します。\`

          ### hard（広範囲・不確実性・新パターン・統合が複雑）

          - normal と同様の**具体的な実装案**（詳細に）
          - テスト実装で検証するポイント
          - 想定リスクと本実装での修正方針
          - 末尾: \`OK でテスト実装を開始します。確認後に本実装へ進みます。\`

          gh issue comment ${ISSUE_NUMBER} --repo ${GH_REPO} --body "【実装案】難易度: ..."

          4. 難易度ラベルを付与:
             easy:   --add-label "agent:difficulty-easy"
             normal: --add-label "agent:difficulty-normal"
             hard:   --add-label "agent:difficulty-hard"

             共通: --add-label "agent:plan-proposed" --remove-label "agent:proposed"

          5. 却下すべき場合は難易度に関わらず理由と代替案を【実装案】に含め、agent:rejected を付与

          ## 制約

          - この段階ではコード変更・PR 作成・agent:approved 付与は行わない
          - easy でも agent:approved は付与しない（ユーザーの OK 待ち）
          EOF
