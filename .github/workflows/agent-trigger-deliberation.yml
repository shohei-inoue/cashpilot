# Issue 作成時に cashpilot-deliberation Automation の Webhook を起動する。
# agent:proposed ラベル付き Issue のみ転送する。

name: Agent Trigger Deliberation

on:
  issues:
    types: [opened, labeled]

jobs:
  trigger:
    if: >
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'agent:proposed')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent:proposed')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cursor deliberation webhook
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_WEBHOOK_DELIBERATION_URL }}
          AUTH_TOKEN: ${{ secrets.CURSOR_AUTOMATION_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_ACTION: ${{ github.event.action }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$AUTH_TOKEN" ]; then
            echo "Webhook secrets not configured. Skipping."
            exit 0
          fi

          payload="$(jq -n \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg issue_title "$ISSUE_TITLE" \
            --arg issue_url "$ISSUE_URL" \
            --arg repo "$REPOSITORY" \
            --arg action "$GITHUB_ACTION" \
            '{event: "issue_deliberation", issue_number: $issue_number, issue_title: $issue_title, issue_url: $issue_url, repo: $repo, github_action: $action}')"

          response_file="$(mktemp)"
          http_code="$(curl -sS -o "$response_file" -w "%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")"

          echo "HTTP status: $http_code"
          echo "Response body:"
          cat "$response_file"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Webhook triggered successfully."
            exit 0
          fi

          echo "::error::Cursor webhook failed with HTTP $http_code"
          exit 1
