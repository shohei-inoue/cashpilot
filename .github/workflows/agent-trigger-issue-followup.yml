# agent:plan-proposed / agent:test-proposed の Issue でユーザー追加入力を処理する。
# 難易度（easy / normal / hard）に応じて分岐する。

name: Agent Trigger Issue Followup

on:
  issues:
    types: [commented]

concurrency:
  group: agent-followup-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  trigger:
    if: >
      (
        contains(join(github.event.issue.labels.*.name, ','), 'agent:plan-proposed') ||
        contains(join(github.event.issue.labels.*.name, ','), 'agent:test-proposed')
      ) &&
      github.event.comment.user.type == 'User' &&
      !startsWith(github.event.comment.body, '@cursor') &&
      !startsWith(github.event.comment.body, '【実装案】') &&
      !startsWith(github.event.comment.body, '【修正案】') &&
      !startsWith(github.event.comment.body, '【テスト実装】') &&
      !startsWith(github.event.comment.body, '【エージェント】')
    runs-on: ubuntu-latest
    steps:
      - name: Request follow-up action via @cursor comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          USER_COMMENT: ${{ github.event.comment.body }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file - <<EOF
          @cursor

          Issue #${ISSUE_NUMBER} でユーザーが追加入力しました。難易度ラベルと状態に応じて次のアクションを実行してください。必ず gh コマンドを実行すること。

          ## ユーザーのコメント

          ${USER_COMMENT}

          ## 手順

          1. Issue・ラベル・コメント履歴を読む:
             gh issue view ${ISSUE_NUMBER} --repo ${GH_REPO} --comments

          2. 直近の【実装案】/【修正案】/【テスト実装】を確認する

          3. 現在の状態と難易度ラベル（agent:difficulty-easy|normal|hard）を確認する

          ---

          ## agent:plan-proposed の場合

          ### A. OK / 承認（「OK」「ok」「進めて」「LGTM」「承認」「/ok」「/implement」など）

          #### easy または normal

          - スコープ外・却下理由がある場合は実装せず理由をコメント
          - 実装可能な場合:
            gh issue edit ${ISSUE_NUMBER} --repo ${GH_REPO} \
              --add-label "agent:approved" \
              --remove-label "agent:plan-proposed" \
              --remove-label "agent:difficulty-easy" \
              --remove-label "agent:difficulty-normal"
            （agent:approved で本実装ワークフローが起動）

          #### hard

          - 本実装はまだ開始しない
          - テスト実装フェーズへ移行:
            gh issue edit ${ISSUE_NUMBER} --repo ${GH_REPO} \
              --add-label "agent:test-implementing" \
              --remove-label "agent:plan-proposed"
            （agent:test-implementing でテスト実装ワークフローが起動）

          ### B. 修正案（「修正案:」「変更して」「別案」「/revise」など）

          - architect subagent で実装案を更新
          - Issue に【修正案】として投稿（変更点を明示）
          - ラベルは agent:plan-proposed と難易度ラベルを維持

          ### C. 却下（「却下」「やめて」「/reject」など）

          - gh issue edit ${ISSUE_NUMBER} --repo ${GH_REPO} \
              --add-label "agent:rejected" \
              --remove-label "agent:plan-proposed" \
              --remove-label "agent:difficulty-easy" \
              --remove-label "agent:difficulty-normal" \
              --remove-label "agent:difficulty-hard"

          ---

          ## agent:test-proposed の場合（hard のテスト実装確認後）

          ### D. OK / 本実装へ（「OK」「ok」「本実装」「/implement」など）

          - gh issue edit ${ISSUE_NUMBER} --repo ${GH_REPO} \
              --add-label "agent:approved" \
              --remove-label "agent:test-proposed" \
              --remove-label "agent:difficulty-hard"
            （agent:approved で本実装ワークフローが起動。テスト実装の結果を踏まえ修正しながら進める）

          ### E. テスト実装の修正（「修正:」「テスト修正:」「/revise-test」など）

          - 【テスト実装】の内容を修正
          - gh issue edit ${ISSUE_NUMBER} --repo ${GH_REPO} \
              --add-label "agent:test-implementing" \
              --remove-label "agent:test-proposed"
            （再度テスト実装ワークフローが起動）

          ### F. 意図が不明

          - 【エージェント】で質問または選択肢を提示
          - ラベルは変更しない

          ## 制約

          - エージェントのコメントは先頭に \`【エージェント】\` を付ける（ループ防止）
          - plan-proposed 段階では PR を作らない（hard の OK はテスト実装へ委譲）
          - test-proposed 段階でも PR を作らない（本実装は agent:approved 後）
          EOF
