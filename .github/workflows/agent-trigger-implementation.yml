# agent:approved ラベル付与時に Cursor に実装依頼する。
# @cursor Issue コメント経由で起動（permission test で動作確認済みの経路）。

name: Agent Trigger Implementation

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  trigger:
    if: github.event.label.name == 'agent:approved'
    runs-on: ubuntu-latest
    steps:
      - name: Request Cursor implementation via @cursor comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file - <<EOF
          @cursor

          Issue #${ISSUE_NUMBER}（agent:approved）を実装し、PR を作成してください。
          Issue コメントの【実装案】または【修正案】に従うこと。

          ## 手順

          1. Issue とコメント履歴を読む（実装案を特定）:
             gh issue view ${ISSUE_NUMBER} --repo ${GH_REPO} --comments

          2. implementer subagent で実装（Phase 5 スコープ、既存 Server Actions パターンに従う）

          3. 検証:
             cd frontend && pnpm lint && pnpm test
             cd backend && go test ./tests/unit/...

          4. PR を作成:
             - ブランチ: cursor/issue-${ISSUE_NUMBER}-5869
             - ベース: develop
             - タイトル: feat(frontend): Issue #${ISSUE_NUMBER} の実装
             - PR ラベル: agent:needs-review
             - 本文に Closes #${ISSUE_NUMBER} を含める

          5. Issue に PR リンクをコメント

          AGENTS.md に従うこと。
          EOF
