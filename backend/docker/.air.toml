# Config file for Air (https://github.com/air-verse/air)
# ホットリロード用。Docker内では poll = true が必要

root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/api"
bin = "tmp/main"
entrypoint = ["./tmp/main"]
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "frontend"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 500
stop_on_error = true
# Docker内でファイル変更を検知するために必須
poll = true
poll_interval = 500

[log]
time = false
main_only = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
